 limitied_terrorism_effect: "允许恐怖袭击目标：\n§Y军用设施§!，§Y政府设施§!，§Y恒星基地军用设施§!\n恐怖袭击将不会杀伤人口"
 unrestricted_terrorism: "无限制恐怖主义"
 unrestricted_terrorism_desc: "为了摧毁星海帝国我们不择手段，杀伤其治下的民众也是破坏帝国社会的一环。"
 unrestricted_terrorism_effect: "允许恐怖袭击目标：\n§Y军用设施§!，§Y政府设施§!，§Y民用设施§!，§Y恒星基地军用设施§!，§Y恒星基地民用设施§!\n恐怖袭击将会杀伤人口，并且造成严重恐慌"
 not_in_this_situation: "£trigger_no£ 战况还没有糟糕到必须采取这种手段"

