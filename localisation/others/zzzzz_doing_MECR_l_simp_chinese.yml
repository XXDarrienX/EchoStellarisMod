 law_category_terrorism: "恐怖主义"
 law_category_terrorism_desc: "这项法案决定义军是否采用恐怖主义手段打击星海帝国。\n§L恐怖袭击是低难度、短流程的谍报行动，可以在星海帝国的随机一颗星球/恒星基地上造成指定类型的破坏。§!§R凡选择皆有代价。§!"
