 CUSTODIAN_POWERS_LIST: "§H参议院会议闭席§!\n参议院的投票流程可以在时长经过180天以后提前结束。\n\n§H冻结议案§!\n冻结一项议案，持续时间$COMMUNITY_FREEZE_RESOLUTION_MONTHS|Y$个月。\n\n§H变更星系焦点§!\n可以在不提议议案的情况下直接变更星系焦点。\n\n§H成员国授予通行权§!\n舰船可以自由进入任何成员国的领域。"
 IMPERIAL_AUTHORITY_INSTANT: "当前§H帝国权威§!为$VAL|2Y$。"
 IMPERIAL_AUTHORITY_DELAYED: "§H帝国权威§E代表了统领国对整个星海帝国的掌控程度。帝国成员可以命令派往帝国的特使增进或削弱帝国权威，特使的每一等级将每月提高§G0.1§!或降低§R0.1§!权威并消耗§Y0.1§!£influence£影响力，同时影响统领国对该国的外交评价。\nAI国家将根据与统领国的关系有限地进行增进或削弱帝国权威的行动。§!§!\n\n§H如果降至§Y0§!：§!\n帝国联邦将被解散。\n\n§H如果低于§Y50§!：§!\n成员国能够通过一项谍报行动触发一场针对统领国的叛乱。\n\n§H如果高于§Y100§!：§!\n整个帝国在面对外敌的防御战争中将同统领国并肩作战。\n\n§H如果高于§Y160§!：§!\n可以发动大远征，以将整片银河纳入星海帝国的疆域。\n\n§H如果高于§Y180§!：§!\n可以提议“星海帝国治下的和平”，禁止帝国属邦之间的战争。\n\n§H如果达到§Y200§!：§!\n可以提议“迈向星河一统的台阶”，开启帝国统一的道路。"
 IMPERIAL_AUTHORITY_TREND: "来自修正的每月变化：§Y[galactic_emperor.VAR_IMPERIAL_AUTHORITY_FROM_MODIFIERS]§!\n来自特使的每月变化：§Y[galactic_emperor.imperial_authority_trend_envoy]§!\n\t\t\t§L团结：§G[galactic_emperor.strengthen_authority_trend]§!\t\t\t削弱：§R[galactic_emperor.undermine_authority_trend]§!§!"
 IMPERIAL_AUTHORITY_TREND_NO_INTEL: "§H我们的情报不足以揭示帝国权威的变化趋势。§!"

 IMPERIAL_ARMADA_DESC: "§H帝国海军舰队§!是由星海帝国的统领国直辖的特战舰队。它们在§H帝国舰队舰船设计器§!中进行设计，能够使用任何星海帝国成员已经研发的科技。\n不能建造超出超出§H帝国舰队海军容量§!的帝国舰队，且不超过容量的舰队不需要维护费。\n帝国舰队海军容量根据星海帝国的议案调节。如果帝国联邦已经建立，将可以从各成员国的海军中征召更多帝国海军舰队容量。"

