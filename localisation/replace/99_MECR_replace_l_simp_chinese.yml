 tr_politics_adopt_desc: "§H此传统树中的所有传统对于星海监管人与星海帝皇有着不同的效果。§!\n\n如果星海共同体尚未建立，立即尝试建立。\n§G+2§!特使\n指派到§Y[GetGalCommunityOrGalImperium]§!的$official_plural_with_icon$每一§Y技能等级§!都将产出0.1£influence£§Y影响力§!。"
 tr_politics_adopt_not_enough_relations: "£trigger_no£ 没有与足够多的国家建立通讯以尝试建立共同体"
 tr_politics_adopt_advanced: "$tr_politics_adopt$"
 tr_politics_adopt_advanced_desc: "§H此传统树中的所有传统对于星海监管人与星海帝皇有着不同的效果。§!\n\n指派到§Y[GetGalCommunityOrGalImperium]§!的$official_plural_with_icon$每一§Y技能等级§!都将产出0.1£influence£§Y影响力§!。"
 tr_politics_finish_desc: "§G+20%§!£diplo_weight£外交权重\n解锁4个[global_event_country.GetGalCommunityOrGalImperium]中的§Y特殊议案§!：\n§L$resolution_community_champions$, $resolution_constitutional_immunity$, $resolution_customs_treaty$, $resolution_galactic_threats_committee$§!\n$TRADITIONS_FINISH_AP$"
 tr_politics_finish_advanced_desc: "§G+20%§!£diplo_weight£外交权重\n解锁4个[global_event_country.GetGalCommunityOrGalImperium]中的§Y特殊议案§!并强化其效果：\n§L$resolution_community_champions$, $resolution_constitutional_immunity$, $resolution_customs_treaty$, $resolution_galactic_threats_committee$§!\n$TRADITIONS_FINISH_AP$"
 tr_politics_national_agenda_desc: "当你提出的议案被通过时，获得12个月量的£unity£§Y凝聚力§!奖励。"
 tr_politics_national_agenda_custodian_desc: "当你提出的议案被通过时，获得12个月量的£unity£§Y凝聚力§!奖励。同时，其他支持此议案的国家都将得到2个月量的£unity£§Y凝聚力§!奖励。"
 tr_politics_national_agenda_custodian_delayed: "$tr_politics_national_agenda_delayed$"
 tr_politics_gravitas_desc: "$mod_resolutions_cost_mult$: §G-20%§!\n指派到§Y[GetGalCommunityOrGalImperium]§!的$official_plural_with_icon$每一§Y技能等级§!产出额外的§G2.5%§!£diplo_weight£外交权重\n设立星系理事会不再有时间限制"
 tr_politics_gravitas_custodian_desc: "$mod_resolutions_cost_mult$: §G-20%§!\n指派到§Y[GetGalCommunityOrGalImperium]§!的$official_plural_with_icon$每一§Y技能等级§!产出额外的§G2.5%§!£diplo_weight£外交权重\n§G+10%§!£diplo_weight£外交权重"
 tr_politics_gravitas_custodian_delayed: "$tr_politics_gravitas_delayed$"
 tr_politics_gravitas_emperor_desc: "$mod_resolutions_cost_mult$: §G-20%§!\n指派到§Y[GetGalCommunityOrGalImperium]§!的$official_plural_with_icon$每一§Y技能等级§!产出额外的§G2.5%§!£diplo_weight£外交权重\n当你提出的议案通过时，§Y$IMPERIAL_AUTHORITY$§!将提高§G10§!。"
 tr_politics_gravitas_emperor_delayed: "$tr_politics_gravitas_delayed$"
 tr_politics_quid_pro_quo_desc: "当你支持的议案通过时，获得提出者的1个§Y外交支持§!。\n如果提出者是星海监管人或星海帝皇并且同样拥有此传统，改为提高§G15§!对方对我们的外交评价。"
 tr_politics_majestic_prestige: "赫赫君威"
 tr_politics_majestic_prestige_desc: "当你提出的议案通过时：\n支持者如果拥有§Y$tr_politics_quid_pro_quo$§!传统，提高来自你的15点§Y外交评价§!。\n反对者如果持有你的外交支持，则失去你的1个§Y外交支持§!，否则§R降低15%§!外交权重（持续8年）。\n其他国家无法通过§Y$tr_politics_quid_pro_quo$§!与§Y$tr_diplomacy_eminent_diplomats$§!传统获取你的外交支持。\n其他国家无法将你卷入§Y$war_goal_wg_proxy_war$§!。"
 tr_politics_majestic_prestige_delayed: "作为银河的领导者，我们的指令应当被理所当然地执行。支持我们是各成员国的义务，而非可以拿来讨价还价的条件。"
 tr_politics_consensus_driven_custodian: "共识推动"
 tr_politics_consensus_driven_custodian_desc: "立即提前结束议程的基础花费由§Y£influence£150§!降低至§Y£influence£100§!。\n此外，参议院会议的投票结果越趋向一致，立即提前结束议程的花费越低。意见统一度为0%时，结束会议花费§Y£influence£100§!；意见统一度为100%时，结束会议花费§Y£influence£0§!。\n§L意见统一度：支持方与反对方中，支持率较高一方外交权重-(较低一方外交权重+弃权方外交权重/3)，最低0%。§!\n\n§G+1§!特使"
 tr_politics_consensus_driven_custodian_delayed: "在银河参议院的会议上协调各方意见是一件困难的事，反过来说在各国的意见趋于一致时就没有必要花费太多的时间和精力。"
 tr_politics_consensus_driven_emperor: "$tr_politics_consensus_driven_custodian$"
 tr_politics_consensus_driven_emperor_desc: "立即提前结束议程的基础花费由§Y£influence£150§!降低至§Y£influence£100§!。\n此外，参议院会议的投票结果越趋向一致，立即提前结束议程的花费越低。意见统一度为0%时，结束会议花费§Y£influence£100§!；意见统一度为100%时，结束会议花费§Y£influence£0§!。\n§L意见统一度：支持方与反对方中，支持率较高一方外交权重-(较低一方外交权重+弃权方外交权重/3)*100%，最低0%。§!\n\n当你提出的议案通过时，§Y帝国治理状态§!将改善§G5§!（不会超过90）。"
 tr_politics_consensus_driven_emperor_delayed: "$tr_politics_consensus_driven_custodian_delayed$"
 tr_politics_extraordinary_powers_custodian_delayed: "$tr_politics_extraordinary_powers_delayed$"
