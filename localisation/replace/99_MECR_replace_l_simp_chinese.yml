########################## 外交
 tr_diplomacy_imperial_prestige: "帝国威仪"
 tr_diplomacy_imperial_prestige_desc: "星海帝皇专属的§Y$policy_diplomatic_stance$§!政策将得到强化。"
 tr_diplomacy_imperial_prestige_delayed: "作为星海帝国的统领者，我们的一举一动都撼动着整个银河。利用高超的技巧，我们能将这股威势转化为实在的外交优势。"
