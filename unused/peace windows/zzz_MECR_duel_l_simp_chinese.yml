l_simp_chinese:
 resolution_custodian_peace_windows_project: "和平视窗计划"
 resolution_custodian_peace_windows_project_desc: "在文明的蒙昧时代就有思想家们提出过用竞赛代替战争的美好构想。在今天，在银河系的公平、正义与安全得到星海监管人充分保障的当下，这项构想将走向现实。"
 resolution_custodian_peace_windows_project_tooltip: "星海共同体的成员国，包括星海监管人，不能相互开战。\n取而代之的是，共同体成员国可以向相邻的共同体成员国发出§Y仲裁战争§!邀请。\n仲裁战争是用一场受限的舰队对决取代两国间战争的机制。双方各自派出一支一定规模的舰队在一个指定星系进行一场战斗，受挑战一方将得到本土作战修正。战斗胜利的一方有权向落败一方提出要求，其限度由受到战胜时残存的舰队比例决定。\n"
 peace_windows_agreement: "§H当前的仲裁战争协议：§!\n$peace_windows_treaty_war_goal$\n$peace_windows_treaty_refuse_invite$\n$peace_windows_treaty_fleet_limit$\n$peace_windows_treaty_cd$\n§E根据以上条款，发起仲裁战争的花费为§Y[This.pcwds_cost]§!£influence£影响力。回避仲裁战争需要向发起者支付两倍于此的影响力。§!"
 peace_windows_treaty_war_goal: "§E战争目标条款：§!\n胜利的一方有权向失败的一方提出以下要求：§Y\n[This.Get_peace_windows_treaty_war_goal_territory]\n[This.Get_peace_windows_treaty_war_goal_subjection]\n[This.Get_peace_windows_treaty_war_goal_reparations]§!"
 peace_windows_treaty_war_goal_territory_yes: " £trigger_yes£ 索取领土"
 peace_windows_treaty_war_goal_territory_no: " £trigger_no£ 索取领土"
 peace_windows_treaty_war_goal_subjection_yes: " £trigger_yes£ 要求臣服"
 peace_windows_treaty_war_goal_subjection_no: " £trigger_no£ 要求臣服"
 peace_windows_treaty_war_goal_reparations_yes: " £trigger_yes£ 索取赔款"
 peace_windows_treaty_war_goal_reparations_no: " £trigger_no£ 索取赔款"
 peace_windows_treaty_refuse_invite: "§E回避战争条款：§!\n受到挑战的国家§Y[This.Get_peace_windows_treaty_refuse_invite]§!回避仲裁战争。"
 peace_windows_treaty_refuse_invite_yes: "有权"
 peace_windows_treaty_refuse_invite_no: "无权"
 peace_windows_treaty_fleet_limit: "§E舰队规模条款：§!\n参战的舰队§Y[This.Get_peace_windows_treaty_fleet_limit]§!。"
 peace_windows_treaty_fleet_limit_200: "规模不超过200"
 peace_windows_treaty_fleet_limit_100: "规模不超过100"
 peace_windows_treaty_fleet_limit_unlimited: "不限制规模"
 peace_windows_treaty_cd: "§E停战时间条款：§!\n发出仲裁战争邀请后§Y[This.Get_peace_windows_treaty_invite_cd]§!年内不得再次发送邀请，接收亦然。\n发出过仲裁战争邀请的两国间§Y[This.Get_peace_windows_treaty_war_cd]§!年内不得再次互相发出邀请。"

 MECR.2799.title: "和平视窗：仲裁战争"
 MECR.2799.desc: "根据和平视窗协议，§Y[Root.GetName]§!向[pcwds_duel_defender.GetName]发起仲裁战争！\n根据协议条款，将由受挑战方在双方都可以抵达的数个备选星系选择一个作为战场。同时，双方必须互相开放边境。\n这是一个debug事件，挑战目标是随机选择的邻国。"

 MECR.2700.title: "和平视窗：发起仲裁战争"
 MECR.2700.desc: "根据和平视窗协议，我们有权每隔五年向另一个[global_event_country.GetGalCommunityOrGalImperium]成员国发起仲裁战争邀请。\n仲裁战争是用一场受限的舰队交战代替真正的战争过程，来裁定有矛盾的两国之间的冲突的国际机制。胜利方将根据战斗后剩余的舰队比例得到胜利点数，并依此要求割让失败方的部分领土。\n$peace_windows_agreement$\n我们是否要向一个国家发起仲裁战争邀请？"
 MECR.2700.option.1.tooltip: "$MECR.2700.option.partA$§Y[be_selected_as_pcwds_1.GetName]§!$MECR.2700.option.partB$"
 MECR.2700.option.2.tooltip: "$MECR.2700.option.partA$§Y[be_selected_as_pcwds_2.GetName]§!$MECR.2700.option.partB$"
 MECR.2700.option.3.tooltip: "$MECR.2700.option.partA$§Y[be_selected_as_pcwds_3.GetName]§!$MECR.2700.option.partB$"
 MECR.2700.option.4.tooltip: "$MECR.2700.option.partA$§Y[be_selected_as_pcwds_4.GetName]§!$MECR.2700.option.partB$"
 MECR.2700.option.5.tooltip: "$MECR.2700.option.partA$§Y[be_selected_as_pcwds_5.GetName]§!$MECR.2700.option.partB$"
 MECR.2700.option.6.tooltip: "$MECR.2700.option.partA$§Y[be_selected_as_pcwds_6.GetName]§!$MECR.2700.option.partB$"
 MECR.2700.option.7.tooltip: "$MECR.2700.option.partA$§Y[be_selected_as_pcwds_7.GetName]§!$MECR.2700.option.partB$"
 MECR.2700.option.8.tooltip: "$MECR.2700.option.partA$§Y[be_selected_as_pcwds_8.GetName]§!$MECR.2700.option.partB$"
 MECR.2700.option.9.tooltip: "$MECR.2700.option.partA$§Y[be_selected_as_pcwds_9.GetName]§!$MECR.2700.option.partB$"
 MECR.2700.option.10.tooltip: "$MECR.2700.option.partA$§Y[be_selected_as_pcwds_10.GetName]§!$MECR.2700.option.partB$"
 MECR.2700.option.partA: "向"
 MECR.2700.option.partB: "发出仲裁战争邀请。\n拒绝此邀请须向我方支付§G[This.pcwds_cost_x2]§! £influence£§Y$influence$§!。\n\n§L[This.Get_peace_windows_treaty_war_cd]年内，参与仲裁战争的各国不可以互相发送仲裁战争邀请。[This.Get_peace_windows_treaty_invite_cd]年内，邀请者不可以发起仲裁战争邀请，受邀请者及受其保护的附庸不可以接收仲裁战争邀请。§!"

 MECR.2700.option.partB.subject: "发出仲裁战争邀请。\n拒绝此邀请须向我方支付§G[This.pcwds_cost_x2]§! £influence£§Y$influence$§!。\n由于对方是附庸国，根据协议，他们可以请求他们的宗主将代为应战。\n若对方的宗主国拒绝应战，两国须各向我方支付§G[This.pcwds_cost]§! £influence£§Y$influence$§!。\n\n§L[This.Get_peace_windows_treaty_war_cd]年内，参与仲裁战争的各国不得互相发送仲裁战争邀请。[This.Get_peace_windows_treaty_invite_cd]年内，邀请者不可以发起仲裁战争邀请，受邀请者、其宗主及受其宗主保护的其他附庸不可以接收仲裁战争邀请。§!"

\n


如果对方的宗主接受，三方进入停战期，仲裁战争须在五年内开始。\n如果对方的宗主拒绝，对方与宗主须各向我方支付§G200§! £influence£§Y$influence$§!，并且[This.Get_peace_windows_treaty_war_cd]年内我们不能再向对方、对方的宗主或对方宗主的其他受保护附庸发出仲裁战争邀请。\n§L[This.Get_peace_windows_treaty_invite_cd]年内，我们不可以发起下一次仲裁战争邀请，对方、对方的宗主不可以接收下一次仲裁战争邀请。§!"
 pduel_precheck_duel_we_are_subjects_under_one_overlord: "我们与对方是同一宗主国下的附庸"
 pduel_precheck_duel_get_invitation_in_five_years: "最近[This.Get_peace_windows_treaty_invite_cd]年内此国收到过仲裁战争邀请。"
 pduel_precheck_duel_targets_overlord_get_invitation_in_five_years: "最近[This.Get_peace_windows_treaty_invite_cd]年内此国的宗主收到过仲裁战争邀请。"
 pduel_precheck_duel_refuse_my_invitation_in_decade: "我们最近[This.Get_peace_windows_treaty_war_cd]年内向此国发出过仲裁战争邀请并被回避。"
 pduel_precheck_duel_arena_no_available: "发起仲裁战争需要存在至少一个双方边境上的安全的星系作为战场。由于没有满足要求的星系，我们无法向此国发出仲裁战争邀请。"
 MECR.2700.option.give_up: "不，没有这个打算"

 MECR.2710.title: "和平视窗：仲裁战争"
 MECR.2710.desc: "根据和平视窗协议，我们已经向§Y[pcwds_duel_target.GetName]§!发起仲裁战争邀请。\n根据协议条款，受挑战方有权选择回避，但这将严重损害他们的国际声誉。\n他们是否决定接受挑战尚不明了，在等待外交回应的同时我们应当让舰队做好准备。"
 MECR.2710.option: "他们有胆子应战吗？"
 MECR.2711.desc: "根据和平视窗协议，§Y[pcwds_duel_attacker.GetName]§!向我们发起了仲裁战争邀请。\n根据协议条款，我们有权选择回避，但这将严重损害我们的国际声誉。\n我们是否应当接受挑战？"
 MECR.2711.option.accept: "我们接受挑战"
 MECR.2711.option.accept.tooltip: "双方进入停战状态。仲裁战争须在五年内开始。"
 MECR.2711.option.call_overlord: "请求宗主代为战斗"
 MECR.2711.option.call_overlord.tooltip: "请求[overlord.GetName]代替我们与对方进行仲裁战争。\n三方进入停战状态。仲裁战争须在五年内开始。"
 MECR.2711.option.refuse: "我们选择回避"
 MECR.2711.option.refuse.tooltip: "我们在外交上做出让步，回避与[pcwds_duel_attacker.GetName]的仲裁战争。"
 MECR.2711.after.tooltip: "[This.Get_peace_windows_treaty_war_cd]年内不可与[pcwds_duel_attacker.GetName]互相发送仲裁战争邀请。[This.Get_peace_windows_treaty_invite_cd]年内不会接收新的仲裁战争邀请。"
 MECR.2714.title: "和平视窗：[pcwds_duel_defender.GetName]接受挑战"
 MECR.2714.desc: "§Y[pcwds_duel_defender.GetName]§!已经接受了我们的仲裁战争邀请。\n根据和平视窗协议条款，作为受挑战方，他们有权在与双方都较为接近且可抵达的数个备选星系选择一个作为战场。"
 MECR.2714.option: "很好"
 MECR.2715.title: "和平视窗：仲裁战争"
 MECR.2715.desc: "§Y[pcwds_duel_attacker.GetName]§!对§Y[pcwds_duel_defender.GetName]§!发起了仲裁战争邀请，并且§Y[pcwds_duel_defender.GetName]§!已经宣布接受挑战。\n让我们拭目以待这场决斗的结果。"
 MECR.2715.option: "有趣"
 MECR.2716.title: "和平视窗：[pcwds_duel_defender.GetName]回避挑战"
 MECR.2716.desc: "不出所料地，§Y[pcwds_duel_defender.GetName]§!回避了我们的仲裁战争邀请。\n根据和平视窗协议条款六，他们不得不在外交上对我们做出大量让步，换取十年内不再接受来自我国的仲裁战争邀请。"
 MECR.2716.option: "懦夫"

 MECR.2802.title: "和平视窗：接受挑战"
 MECR.2802.desc: "我们已经接受了来自§Y[pcwds_duel_attacker.GetName]§!的仲裁战争邀请。\n根据和平视窗协议条款三，作为受挑战方，我们有权在与双方都较为接近且可抵达的数个备选星系选择一个作为战场。"
 MECR.2804.title: "和平视窗：缺少可用战场"
 MECR.2804.desc: "没有任何一个星系满足仲裁战争的战场要求，我们不得不放弃这次试炼。"    #这一条不应该出现，仅仅作为以防万一
 MECR.2804.option: "遗憾"

 MECR.2810.title: "和平视窗：准备仲裁战争"
 MECR.2810.desc: "[pcwds_duel_defender.GetName]已经选择好了战场：[pcwds_duel_arena.GetName]星系。\n根据协议，我们需要派遣一支有§Y指挥官§!指挥，且规模§Y不得大于200§!的舰队前往[pcwds_duel_arena.GetName]星系，并停泊到[pcwds_duel_attacker_position.GetName]星球轨道上执行准备任务。\n如果派出的舰队来自于租借，在战斗结束后合约立即结束。\n双方的舰队就位后，仲裁战争将在数天内开始。"
 MECR.2810.option: "派出我们最强的舰队"
 MECR.2811.title: "和平视窗：准备仲裁战争"
 MECR.2811.desc: "我们已经选择好了战场：[pcwds_duel_arena.GetName]星系。\n根据协议，我们需要派遣一支有§Y指挥官§!指挥，且规模§Y不得大于200§!的舰队前往[pcwds_duel_arena.GetName]星系，并停泊到[pcwds_duel_defender_position.GetName]星球轨道上执行准备任务。\n如果派出的舰队来自于租借，在战斗结束后合约立即结束。\n双方的舰队就位后，仲裁战争将在数天内开始。"
 MECR.2811.option: "派出我们最强的舰队"

 MECR.2812.title: "和平视窗：舰队就位"
 MECR.2812.desc: "我们的舰队[fleet.GetName]已经在[pcwds_duel_attacker_position.GetName]星球轨道上准备完毕。\n只要对方的舰队到场，战斗就将开始。"
 MECR.2812.option: "我们的战士准备好了"
 MECR.2812.option.mercenary: "希望这些佣兵真的靠得住"
 MECR.2814.title: "和平视窗：舰队就位"
 MECR.2814.desc: "我们的舰队[fleet.GetName]已经在[pcwds_duel_defender_position.GetName]星球轨道上准备完毕。\n只要对方的舰队到场，战斗就将开始。"
 MECR.2813.title: "和平视窗：舰队不符合要求"
 MECR.2813.desc: "我们派往[pcwds_duel_attacker_position.GetName]的舰队[fleet.GetName]不符合和平视窗协议的要求：\n[fleet.GetPcwdsBreach_FleetOwner]\n[fleet.GetPcwdsBreach_FleetSize]"
 GetPcwdsBreach_FleetOwner_Federation: "·舰队为联邦舰队"
 GetPcwdsBreach_FleetOwner_GDF: "·舰队为泛星系防卫军舰队"
 GetPcwdsBreach_FleetOwner_IA: "·舰队为帝国海军舰队"
 GetPcwdsBreach_FleetSize: "·舰队规模为[fleet.fleet_size_var]，超过了200"
 MECR.2813.option: "让我们调整一下舰队"
 MECR.2813.option.notowner: "派一支符合要求的舰队过来"

 MECR.2821.title: "和平视窗：仲裁战争开始"
 MECR.2821.desc: "双方的舰队已经在[pcwds_duel_arena.GetName]星系各就各位，仲裁战争正式开始！\n银河系的目光聚焦到了这里，我们的战士将用勇猛的战斗为祖国开疆扩土！"
 MECR.2821.option: "拥抱战斗的荣耀！"
 MECR.2822.title: "和平视窗：仲裁战争开始"
 MECR.2822.desc: "双方的舰队已经在[pcwds_duel_arena.GetName]星系各就各位，仲裁战争正式开始！\n银河系的目光聚焦到了这里，我们的战士将在赛场上英勇地保卫祖国！"
 MECR.2822.option: "赛场亦战场，决斗即守护！"

 MECR.2831.title: "和平视窗：胜利！"
 MECR.2831.desc: "[pcwds_duel_arena.GetName]星系的战斗已经平息，我们是胜利者！\n这些在全银河的注视下取得最高胜利的战士们得到了全国上下最为热烈的拥戴。虽然委员会的正式通告还未下发，但是全国人民已经自发地开始胜利游行。"
 MECR.2831.option: "胜利的桂冠属于我们"
 MECR.2832.title: "和平视窗：落败"
 MECR.2832.desc: "[pcwds_duel_arena.GetName]星系的战斗已经平息，我们的舰队覆灭了。[pcwds_duel_died_admiral.GetName]率领舰队战斗到了最后一刻并与舰同沉。\n他们在全银河的注视下英勇奋战，但终究无力回天。虽然委员会的正式通告还未下发，但悲惨的愁云已经笼罩了人民，他们中的一部分已经要注定离我们而去。"
 MECR.2832.option: "噩梦般的一天"
 MECR.2835.title: "和平视窗：平手"
 MECR.2835.desc: "[pcwds_duel_arena.GetName]星系的战斗已经平息，在数十天的鏖战后，双方的舰队同归于尽了。\n这些在全银河的注视下英勇奋战的战士们没能为他们的祖国赢得一寸领土，但是他们的牺牲使得双方人民免于遭受战争之苦。"
 MECR.2835.option: "意想不到"

 MECR.2840.title: "和平视窗：胜利果实"
 MECR.2840.desc: "作为胜利者，根据和平视窗协议条款十，我们有权获取[pcwds_duel_loser.GetName]的一部分星系的控制权。[GetPCWDSCansubjugationOrNot]\n总计胜利点数取决于胜方损失的舰队比例，损失的舰队少于20%时胜利点数达到最大值100。至少能获得5点胜利点数。\n总计胜利点数: §E[This.pcwds_duel_win_score]§!\n已花费点数: §E[This.pcwds_duel_win_score_used]§!\n剩余点数: §E[This.pcwds_duel_win_score_left]§!"
 GetPCWDSCansubjugationOrNot_yes: "\n根据协议条款十一，我们有权花费胜利点数要求对方成为我们的附庸。"
 MECR.2840.force_become_vassal: "§H要求附庸§! §E花费:§! [GetPcwdsForceSubjectCost]"
 MECR.2840.force_become_vassal.tooltip: "使[pcwds_duel_loser.GetName]成为我们的附庸国，条款取决于我们的$subjugation_war_terms$政策。"
 MECR.2840.give_up_force_become_vassal: "§Y放弃要求附庸§! §E退回:§! [GetPcwdsForceSubjectCostReturn]"
 MECR.2840.give_up_force_become_vassal.tooltip: "不要使[pcwds_duel_loser.GetName]成为我们的附庸国。"
 MECR.2840.force_become_province: "§H纳为行省§! §E花费:§! 50"
 MECR.2840.force_become_province.tooltip: "使[pcwds_duel_loser.GetName]成为我们的帝国行省。"
 MECR.2840.give_up_force_become_province: "§Y放弃纳为行省§! §E退回:§! 50"
 MECR.2840.give_up_force_become_province.tooltip: "不要使[pcwds_duel_loser.GetName]成为我们的帝国行省。"
 MECR.2840.force_become_subsidiary: "§H纳为子公司§! §E花费:§! [GetPcwdsForceSubjectCost]"
 MECR.2840.force_become_subsidiary.tooltip: "使[pcwds_duel_loser.GetName]成为我们的子公司，条款取决于我们的$subjugation_war_terms$政策。"
 MECR.2840.give_up_force_become_subsidiary: "§Y放弃纳为子公司§! §E退回:§! [GetPcwdsForceSubjectCostReturn]"
 MECR.2840.give_up_force_become_subsidiary.tooltip: "不要使[pcwds_duel_loser.GetName]成为我们的子公司。"
 MECR.2840.force_become_tribute: "§H要求朝贡§! §E花费:§! 40"
