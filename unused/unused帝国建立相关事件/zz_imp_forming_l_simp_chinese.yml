 indact_federation_fleet_expansion_low: "低"
 indact_federation_fleet_expansion_low_desc: "更多的军事人员和物资将被投入联邦舰队的建设中。"
 indact_federation_fleet_expansion_low_effect: "所有联邦成员：\n$mod_federation_naval_cap_contribution_mult$ §G+50%§! \n$mod_country_alloys_produces_mult$ §R-10%§!"
 indact_federation_fleet_expansion_mid: "中"
 indact_federation_fleet_expansion_mid_desc: "将联邦舰队的建设作为国家财政之焦点。"
 indact_federation_fleet_expansion_mid_effect: "所有联邦成员：\n$mod_federation_naval_cap_contribution_mult$ §G+100%§! \n$mod_country_alloys_produces_mult$ §R-20%§!"
