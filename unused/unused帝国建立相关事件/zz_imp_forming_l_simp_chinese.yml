l_simp_chinese:
##################################### 通知事件
 emperor.3.outro.desc: "[This.be_one_with_imperium]"
 be_one_with_imperium_forced: "作为前共同体的成员，我们将被纳为星海帝国的行省。\由于昔日与帝国核心的特殊关系，我们相比其他行省将受到更多宠幸。"
 be_one_with_imperium_federation: "作为前共同体的成员，我们将被纳为星海帝国的行省。\n帝国同时发出命令要求解散所有\"局部的国家同盟\"，如果我们希望保持自由与联邦的存在，帝国局势尚未稳定的现在就是脱离帝国的最好时机，但是这样的行为日后可能为我们招致帝国的怒火。\n\n我们应当在联邦法律中提出§Y独立法案§!投票，确认盟友们的意愿。"
 be_one_with_imperium_federation_outsider: "所有的前共同体成员将被纳为星海帝国的行省。\n帝国同时发出命令要求解散所有\"局部的国家同盟\"，而我们的盟友有可能会屈服于帝国的淫威。\n\n我们应当在联邦法律中提出§Y独立法案§!投票，确认盟友们的意愿。"
 be_one_with_imperium_subject: "所有的前共同体成员将被纳为星海帝国的行省。\n帝国同时发出命令要求所有的附庸国直接向皇帝效忠，如果我们的宗主想要维持对我们的统治，可能会脱离星海帝国并将我们拖入与皇帝的对抗。皇帝的密使向我们许诺，如果我们在宗主背离帝国时转而效忠皇帝，那么我们将得到皇帝的恩赐与直接保护。\n我们该怎么做？"
 be_one_with_imperium_outsiders_subject: "所有的前共同体成员将被纳为星海帝国的行省，而由于我们是§H[overlord.GetName]§!的附庸，我们没有加入的资格。\n但皇帝派出的密使向我们许诺，如果我们背叛现在的宗主转而效忠皇帝，将得到皇帝的恩赐与直接保护。\n我们该怎么做？"
 be_one_with_imperium_subject_outsider: "所有的前共同体成员将被纳为星海帝国的行省。\n作为§H[overlord.GetName]§!的附庸，我们只能服从于宗主的安排。"
 be_one_with_imperium_overlord: "作为前共同体的成员，我们将被纳为星海帝国的行省。\n帝国同时发出命令要求所有的附庸国直接向皇帝效忠，如果我们希望保持自由与对诸附庸的控制，帝国局势尚未稳定的现在就是脱离帝国的最好时机，但是这样的行为日后可能为我们招致帝国的怒火。\n我们该怎么做？"
 be_one_with_imperium_not_community_member: "所有的前共同体成员将被纳为星海帝国的行省，一部分国家可能不会服从于这种安排。"
 be_one_with_imperium_normal: "作为前共同体的成员，我们将被纳为星海帝国的行省。\n如果我们希望保持自由，帝国局势尚未稳定的现在就是脱离帝国的最好时机，但是这样的行为日后可能为我们招致帝国的怒火。\n我们该怎么做？"

 emperor.3.join_imperium_forced: "皇帝万岁！"
 emperor.3.join_imperium_forced.tooltip: "§Y星海共同体§!已转变为§Y星海帝国§!，我们将成为星海帝国的行省。"
 emperor.3.join_imperium: "加入星海帝国"
 emperor.3.join_imperium.tooltip: "§Y星海共同体§!已转变为§Y星海帝国§!，我们将成为星海帝国的行省。"
 emperor.3.leave_imperium: "脱离星海帝国"
 emperor.3.leave_imperium.tooltip: "§Y星海共同体§!已转变为§Y星海帝国§!，我们将脱离星海帝国、保持独立。\n\n[This.leave_imperium_additional]"
 emperor.3.federation_follow_leader: "听从联邦领袖"
 emperor.3.federation_follow_leader.tooltip: "§Y星海共同体§!已转变为§Y星海帝国§!，我们将追随联邦领袖的选择，无论是效忠还是背离帝国。"
 emperor.3.subject_follow_overlord: "追随宗主"
 emperor.3.subject_follow_overlord.tooltip: "§Y星海共同体§!已转变为§Y星海帝国§!，我们将追随宗主的选择，无论是效忠还是背离帝国。"
 emperor.3.subject_wait: "静观其变"
 emperor.3.subject_wait.tooltip: "暂时不做出选择。\n如果宗主选择效忠，那么我们也将加入帝国。\n如果宗主选择脱离帝国，我们将有机会在宗主与帝国之间做出选择。"
 emperor.3.subject_betray_overlord: "背弃宗主"
 emperor.3.subject_betray_overlord.tooltip: "§Y星海共同体§!已转变为§Y星海帝国§!，我们将背弃现在的宗主，并向星海帝国效忠。"
 emperor.3.not_community_member: "这与我们无关"
 emperor.3.not_community_member.tooltip: "§Y星海共同体§!已转变为§Y星海帝国§!。"

 emperor.3.join_imperium.tooltip_overlord: "我们的附庸国将转而效忠帝国皇帝。"
 emperor.3.join_imperium.tooltip_federation: "我们将退出当前的联邦。"
 
 federation_independent_act_voting: "£trigger_no£ 我们的联邦正在就独立法案进行讨论，暂时能擅自做出决定"
 federation_has_passed_independent_act: "£trigger_no£ 我们的联邦已经通过独立法案，不允许成员加入星海帝国"
 overlord_joined_imperium: "£trigger_no£ 我们的宗主已经向星海帝国效忠"

 emperor.4.option: "银河系会变得更好"
 emperor.4.option.betray: "但愿这次背叛是值得的"

 emperor.6.name: "帝国的谴责"
 emperor.6.desc: "愚昧和野心带来了这短视可笑的无畏，但没有关系。\n\n终有一天，当遮蔽你们忠诚的叛逆者得到了鲜血的终末，君主的恩泽将再度倾洒于这片无知且不自知的土壤。"
 emperor.6.desc.machine: "计算显示你的短视愚昧导致的错误行为已经使得[Root.GetName]的生存概率下降了<<<89.493%>>>。\n\n帝国会为你修正这个错误的，这是指引者的职责所在。"
 emperor.6.desc.hive: "你们终将理解，凌乱庞杂的思想将被予以武力强制肃清。\n\n无止尽的争吵和短浅的自私永远抵不过一个统一浩大的意志，一切将被强行整合在一个声音之下。"
 emperor.6.option: "关闭显示器"
 emperor.6.option.subject: "但愿我们的宗主能保护好我们"

 emperor.7.name: "反贼！"
 emperor.7.desc: "歹毒的§H[From.GetName]§!拒不臣服于星海帝国！他们宣布从帝国中分裂出去，和其他叛徒一起对抗帝国的统治。"
 emperor.7.option: "他们将为傲慢付出代价。"

 emperor.8.name: "做出抉择"
 emperor.8.overlord_join.desc: "我们的宗主已经决定向星海帝国臣服，这意味着我们不需要再背叛他们。\n我们现在将改为向星海皇帝效忠。"
 emperor.8.overlord_leave.desc: "我们的宗主拒绝向星海帝国臣服，而决心与其对抗到底。\n我们必须§R尽快§!在两者之间做出抉择：\n是延续我们的忠诚，与宗主一同对抗皇帝；还是背叛宗主，换来皇帝的保护？"
 emperor.8.join_imperium_with_overlord: "让人长舒一口气"
 emperor.8.leave_imperium_follow_overlord: "我们将忠于宗主"
 emperor.8.join_imperium_betray_overlord: "我们将加入星海帝国"

 imp_forming.21.title: "局势明朗"
 imp_forming.21.desc.best: "经过星海帝国刚刚建立时的混乱后，银河的局势已经变得明朗。\n\n所有的银河国度都选择向我们臣服，我们的霸主地位无可撼动！"
 imp_forming.21.desc.good: "经过星海帝国刚刚建立时的混乱后，银河的局势已经变得明朗。\n\n绝大多数的银河国度都选择向我们臣服，仅有一小部分宵小选择负隅顽抗，我们可以随时碾碎他们。"
 imp_forming.21.desc.bad: "经过星海帝国刚刚建立时的混乱后，银河的局势已经变得明朗。\n\n只有一小部分的银河国度选择向我们臣服，反抗我们的势力正在集结起来，准备用武力对抗我们。"
 imp_forming.21.desc.worst: "经过星海帝国刚刚建立时的混乱后，银河的局势已经变得明朗。\n\n没有国家愿意接受我们的统治！这些卑鄙的反贼正在集结起来，准备向我们发起挑战。"
 imp_forming.21.option.a: "星海帝国万岁！"
 imp_forming.21.option.b: "可耻的反叛者"
 imp_forming.22.desc.best: "经过星海帝国刚刚建立时的混乱后，银河的局势已经变得明朗。\n\n所有的银河国度都选择向帝国臣服，看来[galactic_emperor.GetName]的霸主地位已经无可撼动。"
 imp_forming.22.desc.good: "经过星海帝国刚刚建立时的混乱后，银河的局势已经变得明朗。\n\n绝大多数的银河国度都选择向帝国臣服，仅有一小部分国家仍然选择抵抗。"
 imp_forming.22.desc.bad: "经过星海帝国刚刚建立时的混乱后，银河的局势已经变得明朗。\n\n只有一小部分的银河国度选择向帝国臣服，反抗帝国的势力正在集结起来，准备用武力对抗皇帝。"
 imp_forming.22.desc.worst: "经过星海帝国刚刚建立时的混乱后，银河的局势已经变得明朗。\n\n没有国家愿意接受[galactic_emperor.GetName]的统治！这下所谓的\"星海帝国\"变成了一个笑话。"
 imp_forming.22.option.a: "$GOOD$"
 imp_forming.22.option.b: "$TERRIBLE$"

 imp_forming.23.title: "危险的独立"
 imp_forming.23.desc: "我们的外交部门提醒道，独自与星海帝国对抗是危险与不明智的，我们应该寻求加入一个联邦来保全自己。\n§Y[leader_federation_against_imperium.GetName]§!已经向我们发出一份邀请，我们是否应当加入？"
 imp_forming.23.option.a: "$MAKE_IT_SO$"
 imp_forming.23.option.b: "我们不会与其他国家合作"
 imp_forming.23.option.c: "这并非取决于我们自己……"
 imp_forming.24.desc: "我们的外交部门提醒道，独自与星海帝国对抗是危险与不明智的，我们应该寻求与其他反抗者合作，建立一个联邦。\n如果决定要这么做，最好尽快派出特使确认其他国家的意向。"

 emperor.352.desc: "随着针对§H[crusade_target_federation.GetName]§!的大远征启动，强大的舰队在星海帝国的全境开始动员起来。对于旁观者而言，看上去任何外部势力想要抗衡帝国的联合舰队力量都无异于痴人说梦，但是接下来的战斗才会决定最终的结果。"

