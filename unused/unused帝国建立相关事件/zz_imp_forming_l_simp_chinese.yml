##################################### 议案
 resolution_galactic_empire_imperial_crusade_anti_federation: "大远征（针对联邦）"
 resolution_galactic_empire_imperial_crusade_anti_federation_desc: "这个星系中仍有一些恼人的虫豸试图抱团抵抗星海帝国的统御，这一现状是有待改善的。帝国发动的大远征，只要获得胜利，便可强迫解散目标联邦，并迫使其成员加入帝国。"
 resolution_galactic_empire_imperial_crusade_anti_federation_tooltip: "星海帝国的全体成员国向目标帝国领导的联邦开战，迫使其成员接受帝国成员的身份。\n取得战争的胜利将会提高50§Y$IMPERIAL_AUTHORITY$§!"
 war_goal_wg_imperial_crusade_anti_federation: "$war_goal_wg_imperial_crusade$（针对联邦）"
 war_goal_wg_imperial_crusade_anti_federation_desc: "为了强迫目标联邦的成员加入星海帝国发动了战争。\n取得战争的胜利将会提高50§Y$IMPERIAL_AUTHORITY$§!\n\n当选择“维持现状”和平时，只要其中包含有至少一个宜居行星，已占领的主要目标所属的区域就会被解放，成为帝国的一个新成员国。"
 war_goal_wg_imperial_crusade_total_war: "帝国征服"
 war_goal_wg_imperial_crusade_total_war_desc: "这场战争是为了把星海帝国的敌人彻底毁灭。\n取得战争的胜利将会提高30§Y$IMPERIAL_AUTHORITY$§!"

##################################### 联邦相关
 law_category_independent_act: "独立公投"
 law_category_independent_act_desc: "维持联邦的存在与皇帝抗衡还是解散联邦加入帝国，联邦必须为此取得共识。"
 fed_law_independent_act: "独立法案"
 fed_law_independent_act_desc: "我们必须为了星系的自由抵抗到底，我们绝不屈服于帝国的威压！"
 fed_law_independent_act_effect: "AI联邦成员将§Y极大倾向§!于共同抵抗星海帝国的威胁。\n\n§H解锁对抗星海帝国的新联邦法令§!"
 fed_law_independent_act_effect_high_centralization: "由于联邦具有较高集权度，所有联邦成员§Y必须§!共同抵抗星海帝国的威胁。\n\n§H解锁对抗星海帝国的新联邦法令§!"

 law_category_indact_military: "联邦共同防卫"
 law_category_indact_military_desc: "为了对抗帝国的军事威胁，我们必须极大程度提高联邦的军事协作水平。"
 indact_federation_fleet_expansion_none: "无"
